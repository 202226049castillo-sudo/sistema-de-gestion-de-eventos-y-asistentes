<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencia de Eventos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="../resources/images/favicon.ico">
</head>
<body>
    <div class="container">
        <header>
            <img src="../resources/images/logo.png" alt="Logo Eventos" class="logo">
            <h1>Sistema de Gestión de Asistencia</h1>
            <nav>
                <button onclick="mostrarSeccion('registro')">Registrar Asistencia</button>
                <button onclick="mostrarSeccion('asistentes')">Ver Asistentes</button>
                <button onclick="mostrarSeccion('eventos')">Gestionar Eventos</button>
            </nav>
        </header>

        <main>
            <!-- Sección de registro de asistencia -->
            <section id="registro" class="seccion-activa">
                <h2><img src="../resources/icons/user.png" alt="Usuario" class="icono"> Registrar Asistencia</h2>
                <form id="formRegistroAsistencia">
                    <div class="form-group">
                        <label for="evento_id">Evento:</label>
                        <select id="evento_id" name="evento_id" required>
                            <option value="">Seleccione un evento</option>
                            <!-- Las opciones se cargan dinámicamente -->
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="codigo_asistente">Código del Asistente:</label>
                        <input type="text" id="codigo_asistente" name="codigo_asistente" required 
                               placeholder="Ingrese código o documento">
                    </div>
                    
                    <button type="submit" class="btn-registrar">
                        <img src="../resources/icons/check.png" alt="Check" class="icono"> Registrar Asistencia
                    </button>
                </form>
                <div id="mensaje"></div>
            </section>

            <!-- Sección de gestión de asistentes -->
            <section id="asistentes" class="seccion-oculta">
                <h2><img src="../resources/icons/user.png" alt="Usuario" class="icono"> Gestión de Asistentes</h2>
                <form id="formRegistrarAsistente">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="documento">Documento de Identidad:</label>
                        <input type="text" id="documento" name="documento" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" name="telefono">
                    </div>
                    
                    <button type="submit" class="btn-registrar">Registrar Asistente</button>
                </form>
            </section>

            <!-- Sección de gestión de eventos -->
            <section id="eventos" class="seccion-oculta">
                <h2><img src="../resources/icons/event.png" alt="Evento" class="icono"> Gestión de Eventos</h2>
                <form id="formRegistrarEvento">
                    <div class="form-group">
                        <label for="nombre_evento">Nombre del Evento:</label>
                        <input type="text" id="nombre_evento" name="nombre_evento" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha_evento">Fecha del Evento:</label>
                        <input type="date" id="fecha_evento" name="fecha_evento" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="ubicacion">Ubicación:</label>
                        <input type="text" id="ubicacion" name="ubicacion" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" rows="3"></textarea>
                    </div>
                    
                    <button type="submit" class="btn-registrar">Registrar Evento</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Sistema de Gestión de Asistencia para Eventos Masivos &copy; 2023</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
